[workspace]
members = [".", "crates/nexus-domain"]

[package]
name = "nexus"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Terminal dashboard for monitoring and managing AI coding agents (Claude, Codex, OpenCode)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/filipeaaoliveira/nexus"
homepage = "https://github.com/filipeaaoliveira/nexus"
keywords = ["tui", "monitoring", "ai", "codex", "claude"]
categories = ["command-line-utilities", "development-tools"]
publish = false  # distributed via `cargo install --git` or built from source; not intended for crates.io

[dependencies]
nexus-domain = { path = "crates/nexus-domain", version = "0.1.0" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"  # used in production code (import_claude_auth writes Keychain output to a NamedTempFile)

[dev-dependencies]
proptest = "1"

[profile.release]
lto = true
strip = true
