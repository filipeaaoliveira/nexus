[advisories]
version = 2
# Deny crates with known security advisories. Add entries to `ignore` only
# for accepted risks with an explanation.
ignore = [
    # ratatui 0.29 depends on paste. RustSec reports paste as unmaintained,
    # with no safe upgrade available. Accepted until ratatui removes or
    # replaces the transitive dependency.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "getrandom@0.2.17", reason = "Transitive via ring/rustls; kept until upstream moves to newer getrandom." },
    { crate = "hashbrown@0.14.5", reason = "Transitive via rusqlite/hashlink; ratatui uses a newer hashbrown." },
    { crate = "linux-raw-sys@0.4.15", reason = "Target-specific transitive via crossterm/rustix 0.38." },
    { crate = "rustix@0.38.44", reason = "Transitive via crossterm; tempfile uses rustix 1.x." },
    { crate = "unicode-width@0.1.14", reason = "Transitive via ratatui/unicode-truncate; ratatui also uses unicode-width 0.2." },
]
skip-tree = [
    { crate = "windows-sys", reason = "Target-specific transitive crate with multiple major versions across rustls, rustix, and tokio ecosystem dependencies." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
